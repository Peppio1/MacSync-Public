name: v0.19.5 mounted SMB deletion validation
on:
  push:
    branches: [develop-v0.19.5]
    paths:
      - 'Sources/MacSyncCore/ChangeJournal.swift'
      - 'Sources/MacSyncCore/LocalInventory.swift'
      - 'Sources/MacSyncCore/MirrorDeletion.swift'
      - 'Sources/MacSyncCore/PostMirrorAbsenceReconciliation.swift'
      - 'Sources/MacSyncCore/RectifiedDuplicateProof.swift'
      - 'Sources/MacSyncCore/NameRectification*.swift'
      - 'Sources/MacSyncCore/MountedFolderCopy.swift'
      - 'Sources/MacSyncCore/DeletionSafety.swift'
      - 'Sources/MacSyncCore/TransferPreflight.swift'
      - 'Sources/MacSyncCore/OperationalSafety.swift'
      - 'Sources/MacSyncCore/StageTransferEngine.swift'
      - 'Sources/MacSyncCore/SQLiteConnectionSetup.swift'
      - 'Sources/MacSync/MountedCopyController.swift'
      - 'Package.swift'
      - 'Tests/MacSyncCoreTests/SMBV0192DeletionValidationTests.swift'
      - 'scripts/ci/prepare-local-samba.sh'
      - 'scripts/ci/cleanup-local-samba.sh'
      - 'Packaging/RcloneSMBRename/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macsync-v0195-smb-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install disposable loopback Samba
        run: brew install samba
      - name: Mount genuine SMB filesystem
        run: bash scripts/ci/prepare-local-samba.sh
      - name: Verify exact literal deletes and preserve hidden or equivalent paths
        env:
          MACSYNC_V0192_REQUIRE_SMB: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter SMBV0192DeletionValidationTests
      - name: Cleanup disposable share
        if: always()
        run: bash scripts/ci/cleanup-local-samba.sh
