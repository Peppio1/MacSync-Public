name: macOS v0.19.2 focused development tests
on:
  push:
    branches: [develop-v0.19.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macsync-v0192-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-names:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Local naming and queue regressions
        run: swift test -Xswiftc -warnings-as-errors --filter 'NameRectificationTests/(testApprovedRules|testNestedRenameAndConflictPreserveData|testV019ManyToOneCollisionLeavesBothOriginals|testV0192LocalPlanCanResumeAfterCancellationWithoutTouchingDestination)|V0191MaintenanceTests/(testV0192LocalRectificationCreatesOrdinaryMonitorChangesWithoutAuditHold|testV0192NameIndexTracksManualChangesAndNestedPaths|testV0192DedicatedNameQueueIncludesInvalidAncestorsAndExcludesBaselineOnly|testV0192PromptDeadlineIsFailClosedAndSingleUse)|IncompatibleNamesTests|SeededArchiveVerifierTests/(testV0192OperationalAuditRecognizesOnlySafePreAuditJobs|testV0192AuditClosesOnlyVerifiedAbsentDeleteJobsWithoutMutation)|MirrorDeletionTests/(testV0192LiteralExtrasDeleteOnlyExactVisiblePaths|testV0192LiteralRecoveryAndInvisibleNamesRemainPending|testV019AuditQueuesExtrasAndNewConsentDeletesOnlyAbsentPaths|testV019RecreatedAuditExtraSupersedesDelete|testPendingNameCannotBeMirroredAwayWhileIndependentDeletionProceeds)|SignedUpdatePolicyTests/(testV0192RollbackOnlySupportsPinnedPredecessor|testV0192RollbackSignatureRejectsTamperedPayloadAndWrongKey|testV0192RollbackCompatibilityPreservesQueueAndInvalidatesOnlyDerivedIndex)'
      - name: Compile application
        run: |
          swift build -Xswiftc -warnings-as-errors --product MacSync
          swift build -Xswiftc -warnings-as-errors --product MacSyncRecovery
