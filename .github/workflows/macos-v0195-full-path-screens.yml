name: MacSync v0.19.5 full path screen captures
on:
  push:
    branches: [verify-v0195-full-path-screens]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Capture actual application views in light appearance
        env:
          MACSYNC_UI_PREVIEW_DIR: ${{ runner.temp }}/macsync-full-path-screens
        run: |
          swift test -Xswiftc -warnings-as-errors --filter MacSyncUIPreviewTests.testRenderFullPathScreens
          test "$(find "$MACSYNC_UI_PREVIEW_DIR" -name 'screen-*.png' -type f | wc -l | tr -d ' ')" = 8
      - name: Preserve captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macsync-full-path-screens
          path: ${{ runner.temp }}/macsync-full-path-screens
          if-no-files-found: warn
          retention-days: 30
