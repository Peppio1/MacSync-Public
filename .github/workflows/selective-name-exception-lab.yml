name: MacSync selective name exception laboratory
on:
  push:
    branches: [probe-v0195-selective-name-exceptions]
    paths:
      - 'Sources/MacSyncCore/**'
      - 'Tests/MacSyncCoreTests/**'
      - '.github/workflows/selective-name-exception-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate selective capture and existing storage regressions
        run: swift test -Xswiftc -warnings-as-errors --filter 'SelectiveNameExceptionTests|SourceNameLineageIntegratedLayoutTests|SourceNameLineageStoreTests|SourceNameLineageQueueTests|LocalInventoryTests|MirrorDeletionTests|ApplicationRollbackTests'
      - name: Same-runner baseline and three layouts
        env:
          MACSYNC_LINEAGE_PERFORMANCE: '1'
          MACSYNC_LINEAGE_PROFILE: '1'
        run: |
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=0 MACSYNC_SELECTIVE_LAB=0 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=1 MACSYNC_SELECTIVE_LAB=0 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=0 MACSYNC_SELECTIVE_LAB=1 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=0 MACSYNC_SELECTIVE_LAB=1 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=1 MACSYNC_SELECTIVE_LAB=0 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=0 MACSYNC_SELECTIVE_LAB=0 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
      - name: Compile app and rollback helper
        run: swift build -Xswiftc -warnings-as-errors
