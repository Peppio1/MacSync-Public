name: MacSync v0.19.5 SMB batch metadata probe
on:
  push:
    branches: [probe-v0195-smb-batch-metadata]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: brew install samba
      - run: bash scripts/ci/prepare-local-samba.sh
      - name: Compile and run native bulk identity capability probe
        run: |
          clang -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra -Werror -O2 scripts/ci/smb-batch/bulk_metadata_probe.c -o "$RUNNER_TEMP/macsync-bulk-probe"
          MACSYNC_BULK_PROBE="$RUNNER_TEMP/macsync-bulk-probe" python3 scripts/ci/smb-batch/run_bulk_probe.py
      - if: always()
        run: bash scripts/ci/cleanup-local-samba.sh
