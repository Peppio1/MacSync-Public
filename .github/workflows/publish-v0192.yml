name: Publish verified v0.19.2 signed update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0192.yml'

permissions:
  contents: read

concurrency:
  group: macsync-publish-v0192
  cancel-in-progress: false

env:
  RUN_ID: '45511033989'
  TESTED_SHA: '638ed54c53843e3890d2e45bb7dd069a03bd1161'
  VALIDATION_RUN: '45505744622'
  VALIDATION_SHA: '676bade8d1ff42cfd0842a52eacaed0d421bf771'
  TAG: 'v0.19.2'
  ZIP_NAME: 'MacSync-v0.19.2-macOS-universal.zip'
  DMG_NAME: 'MacSync-v0.19.2-macOS-universal.dmg'
  PUBLIC_KEY: 'SDsuoQo3jF5WNHSC1yo6B92Nanc9bBdjHJ8O474h9LU='

jobs:
  verify-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v0.19.2]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.pin.outputs.artifact_id }}
      artifact_sha: ${{ steps.pin.outputs.artifact_sha }}
    steps:
      - name: Require exact successful rebuild and pin its unique artifact
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Peppio1/MacSync-Public
          ready=false
          for attempt in $(seq 1 60); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > build-run.json; then
              jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .head_branch == "release-v0.19.2-prep" and .run_attempt == 1' build-run.json
              if jq -e '.status == "completed"' build-run.json >/dev/null; then
                jq -e '.conclusion == "success"' build-run.json
                ready=true
                break
              fi
            fi
            echo "Awaiting the authorized rebuild; no signing key available to this job."
            sleep 30
          done
          test "$ready" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.19.1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > artifacts.json
          jq -e --arg sha "$TESTED_SHA" --argjson run "$RUN_ID" '
            [.artifacts[] | select(.name == "MacSync-macOS-universal" and .expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $sha)] |
            length == 1 and (.[0].digest | test("^sha256:[a-f0-9]{64}$"))' artifacts.json
          artifact_id="$(jq -r '.artifacts[] | select(.name == "MacSync-macOS-universal" and .expired == false) | .id' artifacts.json)"
          artifact_sha="$(jq -r '.artifacts[] | select(.name == "MacSync-macOS-universal" and .expired == false) | .digest | sub("^sha256:";"")' artifacts.json)"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$artifact_sha" =~ ^[a-f0-9]{64}$ ]]
          test "$artifact_id" = 14976023564
          test "$artifact_sha" = cf26f1fd920706012313c7fc8c49c61d282ea872ce488803bd958da70b0a49dd
          printf 'artifact_id=%s\nartifact_sha=%s\n' "$artifact_id" "$artifact_sha" >> "$GITHUB_OUTPUT"

  sign:
    needs: verify-build
    env:
      ARTIFACT_ID: ${{ needs.verify-build.outputs.artifact_id }}
      ARTIFACT_SHA: ${{ needs.verify-build.outputs.artifact_sha }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v0.19.2]')
    runs-on: macos-15
    timeout-minutes: 15
    environment: macsync-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify original successful run, artifact digest and exact packaged application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Peppio1/MacSync-Public
          git cat-file -e "$TESTED_SHA^{commit}"
          expected="$(printf '%s\n' .github/workflows/macos-ci.yml .github/workflows/publish-v0192.yml docs/RELEASE_v0.19.2.md | sort)"
          test "$(git diff --name-only "$TESTED_SHA" "$GITHUB_SHA" | sort)" = "$expected"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > build-run.json
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .head_branch == "release-v0.19.2-prep" and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' build-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs" > build-jobs.json
          jq -e 'any(.jobs[]; .name == "build" and .conclusion == "success" and any(.steps[]; .name == "Prepare branding and verify all icon resolutions" and .conclusion == "success") and any(.steps[]; .name == "Prepare pinned Rclone binaries" and .conclusion == "success") and any(.steps[]; .name == "Release build for Apple Silicon and Intel" and .conclusion == "success") and any(.steps[]; .name == "Assemble and verify universal ad hoc bundle" and .conclusion == "success") and any(.steps[]; .name == "Create graphical DMG and verify mounted contents" and .conclusion == "success") and any(.steps[]; .name == "Build debug test bundle required by isolated Sparkle recovery laboratory" and .conclusion == "success") and any(.steps[]; .name == "Validate Sparkle 2.10.0 with disposable signing keys" and .conclusion == "success") and any(.steps[]; .name == "Run actions/upload-artifact@v6" and .conclusion == "success"))' build-jobs.json
          check_run() {
            local run="$1" sha="$2" branch="$3" job="$4" step="$5"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > validation-run.json
            jq -e --arg sha "$sha" --arg branch "$branch" '.head_sha == $sha and .head_branch == $branch and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' validation-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/1/jobs" > validation-jobs.json
            jq -e --arg job "$job" --arg step "$step" 'any(.jobs[]; .name == $job and .conclusion == "success" and any(.steps[]; .name == $step and .conclusion == "success"))' validation-jobs.json
          }
          check_run 45505739884 "$VALIDATION_SHA" develop-v0.19.2 local-names 'Local naming and queue regressions'
          check_run 45505744622 "$VALIDATION_SHA" validate-v0.19.2-smb validate 'Verify exact literal deletes and preserve hidden or equivalent paths'
          check_run 45505973031 64645d9c760cca1d1eaee2d1bd5a8811f71b2b49 validate-v0.19.2-rollback validate 'Verify actual previous release and isolated offline rollback'
          git merge-base --is-ancestor "$VALIDATION_SHA" "$TESTED_SHA"
          git merge-base --is-ancestor 64645d9c760cca1d1eaee2d1bd5a8811f71b2b49 "$TESTED_SHA"
          test "$(git diff --name-only "$VALIDATION_SHA" 64645d9c760cca1d1eaee2d1bd5a8811f71b2b49 | sort)" = "$(printf '%s\n' .github/workflows/macos-v0192-rollback-validation.yml Sources/MacSyncCore/SignedRollbackTransaction.swift Tests/MacSyncCoreTests/SignedRollbackIntegrationTests.swift | sort)"
          test "$(git diff --name-only 64645d9c760cca1d1eaee2d1bd5a8811f71b2b49 "$TESTED_SHA" | sort)" = "$(printf '%s\n' .github/workflows/macos-v0192-package.yml Packaging/Info.plist Packaging/sign-release-v0192.sh | sort)"
          test "$ARTIFACT_ID" = 14976023564
          test "$ARTIFACT_SHA" = cf26f1fd920706012313c7fc8c49c61d282ea872ce488803bd958da70b0a49dd
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          jq -e --arg sha "$TESTED_SHA" --arg digest "sha256:$ARTIFACT_SHA" --argjson run "$RUN_ID" '.name == "MacSync-macOS-universal" and .expired == false and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha' artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > tested-artifact.zip
          printf '%s  tested-artifact.zip\n' "$ARTIFACT_SHA" | shasum -a 256 -c -
          mkdir signing-input
          unzip -q tested-artifact.zip -d signing-input
          (cd signing-input && shasum -a 256 -c "$ZIP_NAME.sha256" && shasum -a 256 -c "$DMG_NAME.sha256")
          mkdir "$RUNNER_TEMP/verify-package"
          ditto -x -k "signing-input/$ZIP_NAME" "$RUNNER_TEMP/verify-package"
          app="$RUNNER_TEMP/verify-package/MacSync.app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = com.macsync.prototype
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = 0.19.2
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = 200
          test "$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' "$plist")" = "$PUBLIC_KEY"
          test "$(/usr/libexec/PlistBuddy -c 'Print SUFeedURL' "$plist")" = 'https://github.com/Peppio1/MacSync-Public/releases/latest/download/appcast.xml'
          test "$(/usr/libexec/PlistBuddy -c 'Print SURequireSignedFeed' "$plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print SUVerifyUpdateBeforeExtraction' "$plist")" = true
          printf '%s  %s\n' '0dd750be1d060b75f6b4075122e7ef2bf7f59d74090a3872217dc9a417bd5620' 'Packaging/Branding/MacSync-Approved-Original.png' | shasum -a 256 -c -
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["approved_original"] is True and d["source_sha256"]=="0dd750be1d060b75f6b4075122e7ef2bf7f59d74090a3872217dc9a417bd5620"' "$app/Contents/Resources/branding-provenance.json"
          codesign --verify --all-architectures --deep --strict "$app"
          lipo "$app/Contents/MacOS/MacSync" -verify_arch arm64 x86_64
          lipo "$app/Contents/MacOS/MacSyncRecovery" -verify_arch arm64 x86_64
          lipo "$app/Contents/Helpers/rclone" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$app/Contents/Helpers/rclone"
          test ! -e "$app/Contents/Helpers/rclone-smb-rename"
          "$app/Contents/Helpers/rclone" version | grep -F "rclone v1.76.0"
          hdiutil verify "signing-input/$DMG_NAME"
          bash Packaging/prepare-release-signing.sh
      - name: Sign tested archive and appcast with protected production key
        env:
          MACSYNC_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSYNC_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$TESTED_SHA" GITHUB_RUN_ID="$RUN_ID" bash Packaging/sign-release-v0192.sh "signing-input/$ZIP_NAME"
          cmp "signing-input/$ZIP_NAME" "signing-output/$ZIP_NAME"
          cmp "signing-input/$DMG_NAME" "signing-output/$DMG_NAME"
          cp "signing-input/$DMG_NAME.sha256" signing-output/
          (cd signing-output && shasum -a 256 -c SHA256SUMS && shasum -a 256 -c "$DMG_NAME.sha256")
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-v0192-signed
          path: signing-output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: MacSync-v0192-signed
          path: candidate
      - name: Independently verify signed package and feed metadata
        run: |
          set -euo pipefail
          git cat-file -e "$TESTED_SHA^{commit}"
          expected="$(printf '%s\n' .github/workflows/macos-ci.yml .github/workflows/publish-v0192.yml docs/RELEASE_v0.19.2.md | sort)"
          test "$(git diff --name-only "$TESTED_SHA" "$GITHUB_SHA" | sort)" = "$expected"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          cd candidate
          test "$(grep '^commit=' build-provenance.txt)" = "commit=$TESTED_SHA"
          test "$(grep '^run=' build-provenance.txt)" = "run=$RUN_ID"
          test "$(grep '^version=' build-provenance.txt)" = "version=0.19.2"
          sha256sum -c SHA256SUMS
          sha256sum -c "$ZIP_NAME.sha256"
          sha256sum -c "$DMG_NAME.sha256"
          printf '302a300506032b6570032100' | xxd -r -p > /tmp/macsync-pub.der
          printf '%s' "$PUBLIC_KEY" | base64 -d >> /tmp/macsync-pub.der
          base64 -d "$ZIP_NAME.edsignature" > /tmp/macsync-signature.bin
          openssl pkeyutl -verify -pubin -keyform DER -inkey /tmp/macsync-pub.der -rawin -in "$ZIP_NAME" -sigfile /tmp/macsync-signature.bin
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          name=os.environ['ZIP_NAME']
          ns='{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          item=ET.parse('appcast.xml').getroot().find('channel/item')
          assert item is not None
          assert item.findtext(ns+'version')=='200'
          assert item.findtext(ns+'shortVersionString')=='0.19.2'
          assert item.findtext(ns+'minimumSystemVersion')=='13.0'
          enc=item.find('enclosure')
          assert enc.attrib['url']=='https://github.com/Peppio1/MacSync-Public/releases/download/v0.19.2/'+name
          assert enc.attrib[ns+'edSignature']==pathlib.Path(name+'.edsignature').read_text().strip()
          assert int(enc.attrib['length'])==pathlib.Path(name).stat().st_size
          PY
      - name: Upload to a draft and expose the update only after all assets are present
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: refusing to overwrite"; exit 1
          fi
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$TESTED_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$TESTED_SHA" >/dev/null
          fi
          gh release create "$TAG" \
            "candidate/$DMG_NAME" "candidate/$DMG_NAME.sha256" \
            "candidate/$ZIP_NAME" "candidate/$ZIP_NAME.sha256" \
            "candidate/$ZIP_NAME.edsignature" candidate/appcast.xml \
            candidate/build-provenance.txt candidate/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false \
            --title "MacSync v0.19.2 — Aggiornamento di collaudo" \
            --notes-file docs/RELEASE_v0.19.2.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets > draft.json
          jq -e '.isDraft == true and .isPrerelease == false and (.assets | length == 8) and all(.assets[]; .size > 0)' draft.json
          python3 - <<'PY'
          import json, pathlib
          local={p.name:p.stat().st_size for p in pathlib.Path('candidate').iterdir() if p.is_file()}
          remote={p['name']:p['size'] for p in json.load(open('draft.json'))['assets']}
          assert len(local)==8 and local==remote
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url > published.json
          jq -e '.isDraft == false and .isPrerelease == false and (.assets | length == 8)' published.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name | grep -Fx "$TAG"
          curl --fail --location --silent --show-error --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" -o public-appcast.xml
          cmp public-appcast.xml candidate/appcast.xml
          cat published.json
