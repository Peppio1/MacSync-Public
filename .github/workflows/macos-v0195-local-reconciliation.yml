name: MacSync v0.19.5 local reconciliation
on:
  push:
    branches: [develop-v0.19.5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macsync-v0195-reconciliation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Post-mirror reconciliation and safety regressions
        run: swift test -Xswiftc -warnings-as-errors --filter 'MirrorDeletionTests|SeededArchiveVerifierTests.testV0192AuditClosesOnlyVerifiedAbsentDeleteJobsWithoutMutation|SeededArchiveVerifierTests.testV0194'
      - name: Compile app and recovery
        run: |
          swift build -Xswiftc -warnings-as-errors --product MacSync
          swift build -Xswiftc -warnings-as-errors --product MacSyncRecovery
