name: MacSync lineage storage layout experiment
on:
  push:
    branches: [probe-v0195-inventory-lineage-layout]
    paths:
      - 'scripts/ci/probe-inventory-lineage-layout.py'
      - '.github/workflows/lineage-inventory-layout.yml'
      - 'Sources/MacSyncCore/**'
      - 'Tests/MacSyncCoreTests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compare synthetic storage layouts on the same runner
        run: python3 scripts/ci/probe-inventory-lineage-layout.py
      - name: Compile and validate integrated inventory layout
        env:
          MACSYNC_INTERNAL_INVENTORY_LINEAGE: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter 'SourceNameLineageIntegratedLayoutTests|SourceNameLineageStoreTests|SourceNameLineageQueueTests|SourceNameLineageAuditTests|SourceNameLineageInventoryTests|SourceNameLineageTransferTests|LocalInventoryTests|MirrorDeletionTests|ApplicationRollbackTests|SignedUpdatePolicyTests'
      - name: Shared runtime integration with inventory layout
        env:
          MACSYNC_INTERNAL_NAME_LINEAGE: '1'
          MACSYNC_INTERNAL_INVENTORY_LINEAGE: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter SourceNameLineageRuntimeTests
      - name: Compare representative QUICK on same runner
        env:
          MACSYNC_LINEAGE_PERFORMANCE: '1'
        run: |
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=0 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=1 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
      - name: Profile both layouts with detailed phase timings
        env:
          MACSYNC_LINEAGE_PERFORMANCE: '1'
          MACSYNC_LINEAGE_PROFILE: '1'
        run: |
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=1 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
          MACSYNC_INTERNAL_INVENTORY_LINEAGE=0 swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
      - name: Compile application and rollback helper
        run: swift build -Xswiftc -warnings-as-errors
      - name: Prepare pinned Rclone helper
        run: |
          bash Packaging/prepare-rclone.sh "$RUNNER_TEMP/macsync-rclone"
          echo "MACSYNC_TEST_RCLONE=$RUNNER_TEMP/macsync-rclone/rclone" >> "$GITHUB_ENV"
      - name: Install disposable loopback Samba
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install samba
      - name: Mount genuine SMB filesystem
        run: bash scripts/ci/prepare-local-samba.sh
      - name: Validate Rclone lineage and SMB deletion with integrated layout
        env:
          MACSYNC_INTERNAL_INVENTORY_LINEAGE: '1'
          MACSYNC_V0192_REQUIRE_SMB: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter 'SourceNameLineageSMBTests|SMBV0192DeletionValidationTests'
      - name: Cleanup disposable share
        if: always()
        run: bash scripts/ci/cleanup-local-samba.sh
