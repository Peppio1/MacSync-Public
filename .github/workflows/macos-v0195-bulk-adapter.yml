name: MacSync v0.19.5 native bulk adapter
on:
  push:
    branches: [probe-v0195-bulk-adapter]
    paths:
      - 'Sources/MacSyncBulkMetadata/**'
      - 'Sources/MacSyncCore/BulkDirectoryMetadata.swift'
      - 'Sources/MacSyncCore/BulkInventoryFallback.swift'
      - 'Tests/MacSyncCoreTests/BulkDirectoryMetadataTests.swift'
      - 'Tests/MacSyncCoreTests/BulkInventoryFallbackTests.swift'
      - 'Package.swift'
      - '.github/workflows/macos-v0195-bulk-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: brew install samba
      - run: bash scripts/ci/prepare-local-samba.sh
      - name: Compile C and Swift adapter and compare metadata against POSIX
        run: |
          test -n "$MACSYNC_TEST_SMB_MOUNT"
          swift test -Xswiftc -warnings-as-errors --filter BulkDirectoryMetadataTests
      - name: Confirm stalled or cancelled reads cannot spawn another reader
        run: swift test -Xswiftc -warnings-as-errors --filter 'InventoryReadTests.testCancellationReturnsWhileFilesystemReadIsStillPending|InventoryReadTests.testUnresponsiveReadTimesOutWithoutPublishingResult'
      - if: always()
        run: bash scripts/ci/cleanup-local-samba.sh
