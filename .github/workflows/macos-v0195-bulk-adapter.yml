name: MacSync v0.19.5 native bulk adapter
on:
  push:
    branches: [probe-v0195-bulk-adapter]
    paths:
      - 'Sources/MacSyncBulkMetadata/**'
      - 'Sources/MacSyncCore/BulkDirectoryMetadata.swift'
      - 'Sources/MacSyncCore/BulkArchiveScanner.swift'
      - 'Sources/MacSyncCore/ArchiveAudit.swift'
      - 'Sources/MacSyncCore/LocalInventory.swift'
      - 'scripts/ci/prepare-local-samba.sh'
      - 'Sources/MacSyncCore/BulkInventoryFallback.swift'
      - 'Tests/MacSyncCoreTests/BulkDirectoryMetadataTests.swift'
      - 'Tests/MacSyncCoreTests/BulkArchiveScannerTests.swift'
      - 'Tests/MacSyncCoreTests/BulkArchiveAuditIntegrationTests.swift'
      - 'Tests/MacSyncCoreTests/BulkInventoryFallbackTests.swift'
      - 'Package.swift'
      - '.github/workflows/macos-v0195-bulk-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      MACSYNC_CI_BULK_PRESEED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: brew install samba
      - run: bash scripts/ci/prepare-local-samba.sh
      - name: Verify incompatible SMB names and ordinary sibling continuation
        run: |
          test -n "$MACSYNC_TEST_SMB_MOUNT"
          test -n "$MACSYNC_TEST_BULK_PRESEEDED"
          swift test -Xswiftc -warnings-as-errors --filter 'BulkArchiveAuditIntegrationTests.testSMB'
      - if: always()
        run: bash scripts/ci/cleanup-local-samba.sh
