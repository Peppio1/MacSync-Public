name: macOS CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Packaging/**'
      - '.github/workflows/macos-ci.yml'
      - '.github/workflows/macos-ui-preview.yml'
  workflow_dispatch:

# One automatic macOS runner for functional tests, release and UI previews.
# The separate UI workflow remains available for manual preview-only runs.
concurrency:
  group: macsync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tools
        run: |
          xcodebuild -version
          swift --version
      - name: Tests
        run: swift test -Xswiftc -warnings-as-errors
      - name: Release build for Apple Silicon and Intel
        run: |
          set -euo pipefail
          # Keep scratch directories and output files distinct even on
          # case-insensitive APFS (macsync-arm64 == MacSync-arm64).
          slices="$RUNNER_TEMP/macsync-release-slices"
          mkdir -p "$slices"
          for arch in arm64 x86_64; do
            scratch="$RUNNER_TEMP/macsync-swift-build-$arch"
            swift build -c release --arch "$arch" --scratch-path "$scratch" -Xswiftc -warnings-as-errors
            bin="$(swift build -c release --arch "$arch" --scratch-path "$scratch" --show-bin-path)"
            source="$bin/MacSync"
            output="$slices/$arch.macho"
            printf 'Architecture: %s\nSwift bin directory: %s\nExecutable: %s\nOutput: %s\n' "$arch" "$bin" "$source" "$output"
            ls -ld "$source"
            test -f "$source" && test -s "$source" && test -x "$source"
            file "$source"
            file -b "$source" | grep -q 'Mach-O.*executable'
            test ! -e "$output" && test ! -L "$output"
            install -m 755 "$source" "$output"
            test -f "$output" && test -s "$output" && test -x "$output"
            cmp "$source" "$output"
            lipo "$output" -info
            lipo "$output" -verify_arch "$arch"
            test "$(lipo "$output" -archs)" = "$arch"
            helper="$bin/MacSyncRecovery"
            test -x "$helper"
            lipo "$helper" -verify_arch "$arch"
            install -m 755 "$helper" "$slices/recovery-$arch.macho"
          done
      - name: Assemble and verify universal ad hoc bundle
        run: |
          set -euo pipefail
          mkdir -p dist/MacSync.app/Contents/MacOS
          lipo -create "$RUNNER_TEMP/macsync-release-slices/arm64.macho" "$RUNNER_TEMP/macsync-release-slices/x86_64.macho" -output dist/MacSync.app/Contents/MacOS/MacSync
          test -f dist/MacSync.app/Contents/MacOS/MacSync
          test -s dist/MacSync.app/Contents/MacOS/MacSync
          file dist/MacSync.app/Contents/MacOS/MacSync
          chmod 755 dist/MacSync.app/Contents/MacOS/MacSync
          cp Packaging/Info.plist dist/MacSync.app/Contents/Info.plist
          lipo -create "$RUNNER_TEMP/macsync-release-slices/recovery-arm64.macho" "$RUNNER_TEMP/macsync-release-slices/recovery-x86_64.macho" -output dist/MacSync.app/Contents/MacOS/MacSyncRecovery
          chmod 755 dist/MacSync.app/Contents/MacOS/MacSyncRecovery
          lipo dist/MacSync.app/Contents/MacOS/MacSyncRecovery -verify_arch arm64 x86_64
          codesign --force --sign - dist/MacSync.app/Contents/MacOS/MacSyncRecovery
          mkdir -p dist/MacSync.app/Contents/Resources
          install -m 755 "Packaging/Ripristina MacSync.command" "dist/MacSync.app/Contents/Resources/Ripristina MacSync.command"
          framework="$(find "$RUNNER_TEMP/macsync-swift-build-arm64/artifacts" -type d -path '*/macos-*/Sparkle.framework' -print -quit)"
          test -d "$framework"
          mkdir -p dist/MacSync.app/Contents/Frameworks
          ditto "$framework" dist/MacSync.app/Contents/Frameworks/Sparkle.framework
          lipo dist/MacSync.app/Contents/Frameworks/Sparkle.framework/Sparkle -verify_arch arm64 x86_64
          info=dist/MacSync.app/Contents/Info.plist
          exe=dist/MacSync.app/Contents/MacOS/MacSync
          plutil -lint "$info"
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$info")"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$info")" = com.macsync.prototype
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$info")" = MacSync
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundlePackageType' "$info")" = APPL
          test "$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$info")" = 13.0
          test "$(/usr/libexec/PlistBuddy -c 'Print LSUIElement' "$info")" = true
          test -x "$exe"
          lipo "$exe" -info
          lipo "$exe" -verify_arch arm64 x86_64
          otool -L "$exe" | grep -q '@rpath/Sparkle.framework/Versions/B/Sparkle'
          codesign --force --sign - dist/MacSync.app
          codesign --verify --deep --strict --verbose=2 dist/MacSync.app
          zip="MacSync-v$version-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/MacSync.app "dist/$zip"
          mkdir -p "$RUNNER_TEMP/macsync-package-check"
          ditto -x -k "dist/$zip" "$RUNNER_TEMP/macsync-package-check"
          unpacked="$RUNNER_TEMP/macsync-package-check/MacSync.app"
          codesign --verify --deep --strict --verbose=2 "$unpacked"
          test "$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' "$unpacked/Contents/Info.plist")" = 'SDsuoQo3jF5WNHSC1yo6B92Nanc9bBdjHJ8O474h9LU='
          lipo "$unpacked/Contents/Frameworks/Sparkle.framework/Sparkle" -verify_arch arm64 x86_64
          lipo "$unpacked/Contents/MacOS/MacSync" -verify_arch arm64 x86_64
          lipo "$unpacked/Contents/MacOS/MacSyncRecovery" -verify_arch arm64 x86_64
          codesign --verify --strict "$unpacked/Contents/MacOS/MacSyncRecovery"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
      - name: Validate Sparkle 2.10.0 with disposable signing keys
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/MacSync.app/Contents/Info.plist)"
          bash Packaging/test-sparkle-signing.sh "dist/MacSync-v$version-macOS-universal.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-macOS-universal
          path: |
            dist/MacSync-v*-macOS-universal.zip
            dist/MacSync-v*-macOS-universal.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Capture production SwiftUI components with AppKit
        env:
          MACSYNC_UI_PREVIEW_DIR: ${{ runner.temp }}/macsync-ui-previews
        run: swift test --skip-build --filter MacSyncUIPreviewTests
      - name: Check 48 PNG artifacts
        env:
          PREVIEW_DIR: ${{ runner.temp }}/macsync-ui-previews
        run: |
          set -euo pipefail
          for component in folders summary audit schedule; do
            for appearance in light dark; do
              file="$PREVIEW_DIR/$component-$appearance.png"
              test -s "$file"
              sips -g pixelWidth -g pixelHeight "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 1680
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 840
            done
          done
          for page in overview folders schedule audit history settings; do
            for appearance in light dark; do
              file="$PREVIEW_DIR/page-$page-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 2360
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 1640
              file="$PREVIEW_DIR/compact-$page-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 2040
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 1440
              file="$PREVIEW_DIR/minimum-$page-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 1960
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 1320
            done
          done
          for appearance in light dark; do
            for spec in idle:2360:1640 compact-idle:2040:1440; do
              IFS=: read -r variant width height <<< "$spec"
              file="$PREVIEW_DIR/$variant-audit-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = "$width"
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = "$height"
            done
          done
          test "$(find "$PREVIEW_DIR" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = 48
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-UI-Previews
          path: ${{ runner.temp }}/macsync-ui-previews/*.png
          if-no-files-found: error
          retention-days: 7

  publish-v0150:
    # Explicit one-version gate. Never publish ordinary pushes or failed builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v0.15.0]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: MacSync-macOS-universal
          path: release-assets
      - name: Verify exact build and publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.15.0
          asset=MacSync-v0.15.0-macOS-universal.zip
          # Avoid publishing a superseded commit or overwriting any release.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          (cd release-assets && sha256sum -c "$asset.sha256")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: refusing to overwrite"; exit 1
          fi
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh release create "$tag" "release-assets/$asset" "release-assets/$asset.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "MacSync v0.15.0 — Baseline di validazione" --notes-file docs/RELEASE_v0.15.0.md

  validate-production-signature:
    # Only an explicit, trusted push to main can request the protected signing environment.
    # This job creates candidate artifacts; it cannot publish or mutate the repository.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[verify-signing-key]')
    needs: build
    runs-on: macos-15
    timeout-minutes: 12
    environment: macsync-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: MacSync-macOS-universal
          path: signing-input
      - name: Verify exact protected candidate and prepare signing tools
        run: |
          set -euo pipefail
          (cd signing-input && shasum -a 256 -c MacSync-v0.16.0-macOS-universal.zip.sha256)
          bash Packaging/prepare-release-signing.sh
      - name: Validate production key and sign candidate without publishing
        env:
          MACSYNC_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSYNC_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash Packaging/sign-release-candidate.sh signing-input/MacSync-v0.16.0-macOS-universal.zip
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-signed-release-candidate
          path: signing-output/*
          if-no-files-found: error
          retention-days: 7
