name: SQLite targeted diagnostics

on:
  push:
    branches: [diagnostic-sqlite-v0142]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-diagnostics:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tools
        run: |
          xcodebuild -version
          swift --version
      - name: Targeted SQLite and safety tests
        run: swift test --filter OperationalSafetyTests
