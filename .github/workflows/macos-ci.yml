name: macOS CI

on:
  push:
    branches: [main, develop-v0.18.1, develop-v0.18.2, develop-v0.18.3, develop-v0.18.4, develop-v0.18.5, develop-v0.18.6, develop-v0.18.7, develop-v0.18.11]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Packaging/**'
      - '.github/workflows/macos-ci.yml'
      - '.github/workflows/macos-ui-preview.yml'
  workflow_dispatch:
    inputs:
      large_audit:
        description: 'Repeat 200000 files per side local benchmark'
        type: boolean
        default: false
      sign_candidate:
        description: 'Sign the verified candidate (approved branding required)'
        type: boolean
        default: false

# One automatic macOS runner for functional tests, release and UI previews.
# The separate UI workflow remains available for manual preview-only runs.
concurrency:
  group: macsync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Intel runner pool alternative; retain the same macOS major release and both build slices.
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      approved_brand: ${{ steps.brand.outputs.approved }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tools
        run: |
          xcodebuild -version
          swift --version
      - name: Prepare branding and verify all icon resolutions
        id: brand
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/macsync-packaging"
          "$RUNNER_TEMP/macsync-packaging/bin/python" -m pip install --disable-pip-version-check -r Packaging/requirements-packaging.txt
          bash Packaging/prepare-branding.sh "$RUNNER_TEMP/macsync-branding" "$RUNNER_TEMP/macsync-packaging/bin/python"
          approved="$("$RUNNER_TEMP/macsync-packaging/bin/python" -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["approved_original"]).lower())' "$RUNNER_TEMP/macsync-branding/branding-provenance.json")"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          echo "Approved original: $approved"
      - name: Prepare pinned Rclone binaries
        run: bash Packaging/prepare-rclone.sh "$RUNNER_TEMP/macsync-rclone"
      - name: Tests
        env:
          MACSYNC_TEST_RCLONE: ${{ runner.temp }}/macsync-rclone/rclone
        run: swift test -Xswiftc -warnings-as-errors
      - name: Large archive recognition benchmark (200000 files per side)
        if: github.ref == 'refs/heads/develop-v0.18.4' || (github.event_name == 'workflow_dispatch' && inputs.large_audit)
        env:
          MACSYNC_LARGE_AUDIT: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter SeededArchiveVerifierTests/testLargeArchiveRecognition200000Files
      - name: Large genuine differences after queue reset (50000 files)
        if: github.ref == 'refs/heads/develop-v0.18.4' || (github.event_name == 'workflow_dispatch' && inputs.large_audit)
        env:
          MACSYNC_LARGE_AUDIT: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter SeededArchiveVerifierTests/testLargeArchiveQueues50000GenuineDifferencesAfterReset
      - name: Release build for Apple Silicon and Intel
        run: |
          set -euo pipefail
          # Keep scratch directories and output files distinct even on
          # case-insensitive APFS (macsync-arm64 == MacSync-arm64).
          slices="$RUNNER_TEMP/macsync-release-slices"
          mkdir -p "$slices"
          for arch in arm64 x86_64; do
            scratch="$RUNNER_TEMP/macsync-swift-build-$arch"
            swift build -c release --arch "$arch" --scratch-path "$scratch" -Xswiftc -warnings-as-errors
            bin="$(swift build -c release --arch "$arch" --scratch-path "$scratch" --show-bin-path)"
            source="$bin/MacSync"
            output="$slices/$arch.macho"
            printf 'Architecture: %s\nSwift bin directory: %s\nExecutable: %s\nOutput: %s\n' "$arch" "$bin" "$source" "$output"
            ls -ld "$source"
            test -f "$source" && test -s "$source" && test -x "$source"
            file "$source"
            file -b "$source" | grep -q 'Mach-O.*executable'
            test ! -e "$output" && test ! -L "$output"
            install -m 755 "$source" "$output"
            test -f "$output" && test -s "$output" && test -x "$output"
            cmp "$source" "$output"
            lipo "$output" -info
            lipo "$output" -verify_arch "$arch"
            test "$(lipo "$output" -archs)" = "$arch"
            helper="$bin/MacSyncRecovery"
            test -x "$helper"
            lipo "$helper" -verify_arch "$arch"
            install -m 755 "$helper" "$slices/recovery-$arch.macho"
          done
      - name: Assemble and verify universal ad hoc bundle
        run: |
          set -euo pipefail
          mkdir -p dist/MacSync.app/Contents/MacOS
          lipo -create "$RUNNER_TEMP/macsync-release-slices/arm64.macho" "$RUNNER_TEMP/macsync-release-slices/x86_64.macho" -output dist/MacSync.app/Contents/MacOS/MacSync
          test -f dist/MacSync.app/Contents/MacOS/MacSync
          test -s dist/MacSync.app/Contents/MacOS/MacSync
          file dist/MacSync.app/Contents/MacOS/MacSync
          chmod 755 dist/MacSync.app/Contents/MacOS/MacSync
          cp Packaging/Info.plist dist/MacSync.app/Contents/Info.plist
          lipo -create "$RUNNER_TEMP/macsync-release-slices/recovery-arm64.macho" "$RUNNER_TEMP/macsync-release-slices/recovery-x86_64.macho" -output dist/MacSync.app/Contents/MacOS/MacSyncRecovery
          chmod 755 dist/MacSync.app/Contents/MacOS/MacSyncRecovery
          lipo dist/MacSync.app/Contents/MacOS/MacSyncRecovery -verify_arch arm64 x86_64
          codesign --force --sign - dist/MacSync.app/Contents/MacOS/MacSyncRecovery
          mkdir -p dist/MacSync.app/Contents/Helpers
          install -m 755 "$RUNNER_TEMP/macsync-rclone/rclone" dist/MacSync.app/Contents/Helpers/rclone
          lipo dist/MacSync.app/Contents/Helpers/rclone -verify_arch arm64 x86_64
          codesign --force --sign - dist/MacSync.app/Contents/Helpers/rclone
          mkdir -p dist/MacSync.app/Contents/Resources
          install -m 644 Packaging/Rclone-LICENSE.txt dist/MacSync.app/Contents/Resources/Rclone-LICENSE.txt
          install -m 644 "$RUNNER_TEMP/macsync-rclone/provenance.txt" dist/MacSync.app/Contents/Resources/Rclone-provenance.txt
          install -m 755 "Packaging/Ripristina MacSync.command" "dist/MacSync.app/Contents/Resources/Ripristina MacSync.command"
          for f in MacSync.icns MacSyncBrand.png MacSyncMenuTemplate.png branding-provenance.json; do
            install -m 644 "$RUNNER_TEMP/macsync-branding/$f" "dist/MacSync.app/Contents/Resources/$f"
          done
          install -m 644 "Packaging/Guida installazione.html" "dist/MacSync.app/Contents/Resources/Guida installazione.html"
          framework="$(find "$RUNNER_TEMP/macsync-swift-build-arm64/artifacts" -type d -path '*/macos-*/Sparkle.framework' -print -quit)"
          test -d "$framework"
          mkdir -p dist/MacSync.app/Contents/Frameworks
          ditto "$framework" dist/MacSync.app/Contents/Frameworks/Sparkle.framework
          lipo dist/MacSync.app/Contents/Frameworks/Sparkle.framework/Sparkle -verify_arch arm64 x86_64
          info=dist/MacSync.app/Contents/Info.plist
          exe=dist/MacSync.app/Contents/MacOS/MacSync
          plutil -lint "$info"
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$info")"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$info")" = com.macsync.prototype
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$info")" = MacSync
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundlePackageType' "$info")" = APPL
          test "$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$info")" = 13.0
          test "$(/usr/libexec/PlistBuddy -c 'Print LSUIElement' "$info")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$info")" = MacSync.icns
          test "$version" = 0.18.11
          test -s dist/MacSync.app/Contents/Resources/MacSync.icns
          test -x "$exe"
          lipo "$exe" -info
          lipo "$exe" -verify_arch arm64 x86_64
          otool -L "$exe" | grep -q '@rpath/Sparkle.framework/Versions/B/Sparkle'
          codesign --force --sign - dist/MacSync.app
          codesign --verify --deep --strict --verbose=2 dist/MacSync.app
          zip="MacSync-v$version-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/MacSync.app "dist/$zip"
          mkdir -p "$RUNNER_TEMP/macsync-package-check"
          ditto -x -k "dist/$zip" "$RUNNER_TEMP/macsync-package-check"
          unpacked="$RUNNER_TEMP/macsync-package-check/MacSync.app"
          codesign --verify --deep --strict --verbose=2 "$unpacked"
          test "$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' "$unpacked/Contents/Info.plist")" = 'SDsuoQo3jF5WNHSC1yo6B92Nanc9bBdjHJ8O474h9LU='
          lipo "$unpacked/Contents/Frameworks/Sparkle.framework/Sparkle" -verify_arch arm64 x86_64
          lipo "$unpacked/Contents/MacOS/MacSync" -verify_arch arm64 x86_64
          lipo "$unpacked/Contents/MacOS/MacSyncRecovery" -verify_arch arm64 x86_64
          codesign --verify --strict "$unpacked/Contents/MacOS/MacSyncRecovery"
          lipo "$unpacked/Contents/Helpers/rclone" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$unpacked/Contents/Helpers/rclone"
          "$unpacked/Contents/Helpers/rclone" version | grep -F "rclone v1.76.0"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
      - name: Create graphical DMG and verify mounted contents
        run: bash Packaging/build-dmg.sh dist/MacSync.app "$RUNNER_TEMP/macsync-branding" dist "$RUNNER_TEMP/macsync-packaging/bin/python"
      - name: Validate Sparkle 2.10.0 with disposable signing keys
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/MacSync.app/Contents/Info.plist)"
          bash Packaging/test-sparkle-signing.sh "dist/MacSync-v$version-macOS-universal.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-macOS-universal
          path: |
            dist/MacSync-v*-macOS-universal.zip
            dist/MacSync-v*-macOS-universal.zip.sha256
            dist/MacSync-v*-macOS-universal.dmg
            dist/MacSync-v*-macOS-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Capture production SwiftUI components with AppKit
        env:
          MACSYNC_UI_PREVIEW_DIR: ${{ runner.temp }}/macsync-ui-previews
          MACSYNC_BRAND_PREVIEW_DIR: ${{ runner.temp }}/macsync-branding
        run: swift test --skip-build --filter MacSyncUIPreviewTests
      - name: Check 57 PNG artifacts
        env:
          PREVIEW_DIR: ${{ runner.temp }}/macsync-ui-previews
        run: |
          set -euo pipefail
          for component in folders summary audit schedule; do
            for appearance in light dark; do
              file="$PREVIEW_DIR/$component-$appearance.png"
              test -s "$file"
              sips -g pixelWidth -g pixelHeight "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 1680
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 840
            done
          done
          for page in overview folders schedule audit names history settings; do
            for appearance in light dark; do
              file="$PREVIEW_DIR/page-$page-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 2360
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 1640
              file="$PREVIEW_DIR/compact-$page-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 2040
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 1440
              file="$PREVIEW_DIR/minimum-$page-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 1960
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 1320
            done
          done
          for appearance in light dark; do
            for spec in idle:2360:1640 compact-idle:2040:1440; do
              IFS=: read -r variant width height <<< "$spec"
              file="$PREVIEW_DIR/$variant-audit-$appearance.png"
              test -s "$file"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = "$width"
              test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = "$height"
            done
          done
          test "$(find "$PREVIEW_DIR" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = 57
          test -s "$PREVIEW_DIR/page-technical-light.png"
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-UI-Previews
          path: ${{ runner.temp }}/macsync-ui-previews/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Select one full-size screenshot per page
        env:
          PREVIEW_DIR: ${{ runner.temp }}/macsync-ui-previews
          REVIEW_DIR: ${{ runner.temp }}/macsync-review-pages
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          for page in overview folders schedule audit names history settings technical; do
            cp "$PREVIEW_DIR/page-$page-light.png" "$REVIEW_DIR/$page.png"
          done
          test "$(find "$REVIEW_DIR" -name '*.png' | wc -l | tr -d ' ')" = 8
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-v01811-review-pages
          path: ${{ runner.temp }}/macsync-review-pages/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload packaging and branding previews
        uses: actions/upload-artifact@v6
        with:
          name: MacSync-Branding-and-Installer
          path: |
            ${{ runner.temp }}/macsync-branding/MacSyncBrand.png
            ${{ runner.temp }}/macsync-branding/MacSyncMenuTemplate.png
            ${{ runner.temp }}/macsync-branding/MacSync.icns
            ${{ runner.temp }}/macsync-branding/MacSync-DMG-Background.png
            ${{ runner.temp }}/macsync-branding/branding-provenance.json
            Packaging/Guida installazione.html
          if-no-files-found: error
          retention-days: 7

  validate-production-signature:
    # Only an explicit, trusted push to main can request the protected signing environment.
    # This job creates candidate artifacts; it cannot publish or mutate the repository.
    if: needs.build.outputs.approved_brand == 'true' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-signing-key]')) || (github.event_name == 'workflow_dispatch' && inputs.sign_candidate))
    needs: build
    runs-on: macos-15
    timeout-minutes: 12
    environment: macsync-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: MacSync-macOS-universal
          path: signing-input
      - name: Verify exact protected candidate and prepare signing tools
        run: |
          set -euo pipefail
          (cd signing-input && shasum -a 256 -c MacSync-v0.18.11-macOS-universal.zip.sha256)
          (cd signing-input && shasum -a 256 -c MacSync-v0.18.11-macOS-universal.dmg.sha256)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s  %s\n' '0dd750be1d060b75f6b4075122e7ef2bf7f59d74090a3872217dc9a417bd5620' 'Packaging/Branding/MacSync-Approved-Original.png' | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/verify-branded-package"
          ditto -x -k signing-input/MacSync-v0.18.11-macOS-universal.zip "$RUNNER_TEMP/verify-branded-package"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["approved_original"] is True and d["source_sha256"]=="0dd750be1d060b75f6b4075122e7ef2bf7f59d74090a3872217dc9a417bd5620"' "$RUNNER_TEMP/verify-branded-package/MacSync.app/Contents/Resources/branding-provenance.json"
          codesign --verify --deep --strict "$RUNNER_TEMP/verify-branded-package/MacSync.app"
          bash Packaging/prepare-release-signing.sh
      - name: Validate production key and sign candidate without publishing
        env:
          MACSYNC_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSYNC_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash Packaging/sign-release-candidate.sh signing-input/MacSync-v0.18.11-macOS-universal.zip
      - uses: actions/upload-artifact@v6
        with:
          name: MacSync-signed-release-candidate
          path: signing-output/*
          if-no-files-found: error
          retention-days: 7

# Fresh CI run after two runner assignment failures; source and build configuration unchanged.
