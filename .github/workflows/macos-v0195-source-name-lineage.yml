name: MacSync v0.19.5 local name lineage
on:
  push:
    branches: [probe-v0195-source-name-lineage]
    paths:
      - 'Sources/MacSyncCore/SourceNameLineage.swift'
      - 'Sources/MacSyncCore/LocalInventory.swift'
      - 'Sources/MacSyncCore/ChangeJournal.swift'
      - 'Sources/MacSyncCore/ArchiveAudit.swift'
      - 'Sources/MacSyncCore/MountedFolderCopy.swift'
      - 'Sources/MacSyncCore/MirrorDeletion.swift'
      - 'Sources/MacSyncCore/SignedRollbackTransaction.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageQueueTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageSMBTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageRuntimeTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineagePerformanceTests.swift'
      - 'Tests/MacSyncCoreTests/SignedRollbackIntegrationTests.swift'
      - 'Sources/MacSyncCore/SeededArchiveVerifier.swift'
      - 'Sources/MacSync/RuntimeStorageGuard.swift'
      - 'Sources/MacSync/RollbackConfirmation.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageTransferTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageAuditTests.swift'
      - 'Tests/MacSyncCoreTests/OfflineNamePreparationTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageInventoryTests.swift'
      - 'Sources/MacSyncCore/SourceNameLineageStore.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageStoreTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageTests.swift'
      - '.github/workflows/macos-v0195-source-name-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: swift test -Xswiftc -warnings-as-errors --filter 'SourceNameLineageQueueTests|SourceNameLineageStoreTests|LocalInventoryTests|MirrorDeletionTests|ApplicationRollbackTests|SignedUpdatePolicyTests'
      - name: Integrated runtime policy and safe rollback database
        env:
          MACSYNC_INTERNAL_NAME_LINEAGE: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter SourceNameLineageRuntimeTests
      - name: Representative inventory, QUICK and daily workload
        env:
          MACSYNC_LINEAGE_PERFORMANCE: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter SourceNameLineagePerformanceTests
      - name: Compile application and rollback helper
        run: swift build -Xswiftc -warnings-as-errors
      - name: Prepare pinned Rclone helper
        run: |
          bash Packaging/prepare-rclone.sh "$RUNNER_TEMP/macsync-rclone"
          echo "MACSYNC_TEST_RCLONE=$RUNNER_TEMP/macsync-rclone/rclone" >> "$GITHUB_ENV"
      - name: Install disposable loopback Samba
        run: brew install samba
      - name: Mount genuine SMB filesystem
        run: bash scripts/ci/prepare-local-samba.sh
      - name: Validate Rclone lineage and SMB deletion regressions
        env:
          MACSYNC_V0192_REQUIRE_SMB: '1'
        run: swift test -Xswiftc -warnings-as-errors --filter 'SourceNameLineageSMBTests|SMBV0192DeletionValidationTests'
      - name: Cleanup disposable share
        if: always()
        run: bash scripts/ci/cleanup-local-samba.sh
