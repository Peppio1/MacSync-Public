name: MacSync v0.19.5 local name lineage
on:
  push:
    branches: [probe-v0195-source-name-lineage]
    paths:
      - 'Sources/MacSyncCore/SourceNameLineage.swift'
      - 'Sources/MacSyncCore/LocalInventory.swift'
      - 'Sources/MacSyncCore/ChangeJournal.swift'
      - 'Sources/MacSyncCore/ArchiveAudit.swift'
      - 'Sources/MacSyncCore/MountedFolderCopy.swift'
      - 'Sources/MacSyncCore/MirrorDeletion.swift'
      - 'Sources/MacSyncCore/SignedRollbackTransaction.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageQueueTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageTransferTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageAuditTests.swift'
      - 'Tests/MacSyncCoreTests/OfflineNamePreparationTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageInventoryTests.swift'
      - 'Sources/MacSyncCore/SourceNameLineageStore.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageStoreTests.swift'
      - 'Tests/MacSyncCoreTests/SourceNameLineageTests.swift'
      - '.github/workflows/macos-v0195-source-name-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: swift test -Xswiftc -warnings-as-errors --filter 'SourceNameLineageQueueTests|SourceNameLineageStoreTests|LocalInventoryTests|MirrorDeletionTests|ApplicationRollbackTests|SignedUpdatePolicyTests'
