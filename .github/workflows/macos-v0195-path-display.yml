name: MacSync v0.19.5 structured path display
on:
  push:
    branches: [develop-v0.19.5]
    paths:
      - 'Sources/MacSync/**'
      - 'Sources/MacSyncCore/ArchivePathPresentation.swift'
      - 'Tests/MacSyncCoreTests/ArchivePathPresentationTests.swift'
      - '.github/workflows/macos-v0195-path-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Structured path and Finder safety tests
        run: swift test -Xswiftc -warnings-as-errors --filter ArchivePathPresentationTests
      - name: Compile app
        run: swift build -Xswiftc -warnings-as-errors --product MacSync
